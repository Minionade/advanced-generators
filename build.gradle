plugins {
    id 'architectury-plugin' version '3.4.162'
    id 'dev.architectury.loom' version '1.10.455' apply false
    id 'com.gradleup.shadow' version '8.3.6' apply false
}
architectury { minecraft = minecraft_version }
allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version + '+mc' + rootProject.minecraft_version
}
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    base { archivesName = "advgenerators-${project.name}" }
    java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
    loom { silentMojangMappingsLicense() }
    repositories {
        mavenCentral()
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.teamreborn.com/' }
        maven { url = 'https://maven.blamejared.com/' }
        maven { url = 'https://api.modrinth.com/maven' }
        maven { url = 'https://modmaven.dev/' }
    }
    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }
    tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
    tasks.withType(ProcessResources).configureEach {
        inputs.property 'version', project.version
        filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) { expand version: project.version }
    }
    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE'))
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}
