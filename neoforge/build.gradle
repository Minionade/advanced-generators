plugins { id 'com.gradleup.shadow' }
architectury {
    platformSetupLoomIde()
    neoForge()
}
repositories {
    maven { url = 'https://www.cursemaven.com' }
}
configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}
dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"
    modCompileOnly "mezz.jei:jei-1.21.1-neoforge-api:${rootProject.jei_version}"
    modLocalRuntime "mezz.jei:jei-1.21.1-neoforge:${rootProject.jei_version}"
    modCompileOnly "curse.maven:mekanism-268560:6895131"
    modCompileOnly "curse.maven:singularity-iteration-1617642:9299533"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
}
shadowJar { configurations = [project.configurations.shadowCommon]; archiveClassifier = 'dev-shadow' }
remapJar { inputFile.set shadowJar.archiveFile; dependsOn shadowJar; archiveClassifier = null }
jar { archiveClassifier = 'dev' }
sourcesJar { from project(':common').sourceSets.main.allSource }
