name: Build 1.21.1
on:
  push:
    branches: ['1.21.1']
  pull_request:
    branches: ['1.21.1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: advgenerators-1.21.1
          path: |
            fabric/build/libs/*mc1.21.1.jar
            neoforge/build/libs/*mc1.21.1.jar
